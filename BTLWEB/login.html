
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>StudyTime - Đăng nhập</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf0f8;
            margin: 0;
        }

        .login {
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background-color: #1e3a8a;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>StudyTime</h1>
        <p>Đăng nhập để quản lý lịch học</p>

        <form action="index.html">

            <input type="text"
                   placeholder="Tên đăng nhập"
                   required>

            <input type="password"
                   placeholder="Mật khẩu"
                   required>

            <button type="submit">Đăng nhập</button>

        </form>

    </div>

</body>
</html>
