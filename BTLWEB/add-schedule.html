<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Lịch Học</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: #ffffff;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
        }

        label {
            font-weight: bold;
            color: #555555;
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Giúp padding không bị tràn viền */
            font-size: 14px;
        }

     
        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        p {
            margin-bottom: 15px;
        }

      
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            float: right;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

       
        button[type="reset"] {
            background-color: #f1f1f1;
            color: #333;
        }

        button[type="reset"]:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h2>Thêm Lịch Học</h2>

    <form>
        <p>
            <label for="subject">Tên môn học:</label><br>
            <input type="text" id="subject" name="subject" placeholder="VD: Lập trình C" required>
        </p>

        <!-- 2. Ngày học -->
        <p>
            <label for="date">Ngày học:</label><br>
            <input type="date" id="date" name="date" required>
        </p>

        <!-- 3. Giờ học (Bắt đầu và Kết thúc) -->
        <p>
            <label for="time1">Thời gian học:</label><br>
            <label for="time1">Từ:</label>
                <input type="time" id="time1" name="start_time" required>
            <label for="time2">Đến:</label>
                <input type="time" id="time2" name="end_time" required>
        </p>

        <!-- 4. Phòng học -->
        <p>
            <label for="room">Phòng học:</label><br>
            <input type="text" id="room" name="room" placeholder="VD: Phòng 302 - Nhà A" required>
        </p>

        <!-- 5. Giảng viên -->
        <p>
            <label for="teacher">Giảng viên (nếu cần):</label><br>
            <input type="text" id="teacher" name="teacher" placeholder="VD: Thầy Nam">
        </p>

        <!-- 6. Ghi chú thêm -->
        <p>
            <label for="note">Ghi chú:</label><br>
            <textarea id="note" name="note" rows="3" placeholder="Nhập ghi chú (nếu có)..."></textarea>
        </p>

        <!-- 7. Nút bấm -->
        <p>
            <button type="reset">Nhập lại</button>
            <button type="submit">Thêm lịch học</button>
        </p>
    </form>

</body>
</html>
