
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm lịch học - My Timetable</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Thanh menu ben trai -->
    <div class="sidebar">
        <h2>My Timetable</h2>

        <a href="index.html">🏠 Trang chủ</a>
        <a href="timetable.html">📅 Lịch tuần</a>
        <a href="add-schedule.html" class="active">➕ Thêm lịch học</a>
        <a href="subjects.html">📚 Danh sách môn</a>

        <div class="note">
            <h3>Ghi chú</h3>
            <p>Quản lý lịch học của bạn dễ dàng và khoa học.</p>
        </div>
    </div>

    <!-- Noi dung chinh -->
    <div class="main">

        <div class="header">
            <div>
                <h1>Thêm lịch học</h1>
                <p>Điền thông tin để tạo lịch học mới.</p>
            </div>

            <div class="avatar">SV</div>
        </div>

        <!-- Form nhap lich hoc -->
        <div class="schedule">
            <h2>Thông tin buổi học</h2>
            <p class="description">
                Vui lòng điền đầy đủ thông tin bên dưới.
            </p>

            <form action="#" method="get">

                <div class="form-group">
                    <label for="subject">Tên môn học</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Ví dụ: Lập trình C++"
                        required>
                </div>

                <div class="form-group">
                    <label for="day">Thứ trong tuần</label>
                    <select id="day" name="day" required>
                        <option value="">-- Chọn thứ --</option>
                        <option value="2">Thứ 2</option>
                        <option value="3">Thứ 3</option>
                        <option value="4">Thứ 4</option>
                        <option value="5">Thứ 5</option>
                        <option value="6">Thứ 6</option>
                        <option value="7">Thứ 7</option>
                        <option value="cn">Chủ nhật</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Ngày học</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="start">Giờ bắt đầu</label>
                        <input
                            type="time"
                            id="start"
                            name="start"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="end">Giờ kết thúc</label>
                        <input
                            type="time"
                            id="end"
                            name="end"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="room">Phòng học</label>
                    <input
                        type="text"
                        id="room"
                        name="room"
                        placeholder="Ví dụ: A101"
                        required>
                </div>

                <div class="form-group">
                    <label for="teacher">Giảng viên</label>
                    <input
                        type="text"
                        id="teacher"
                        name="teacher"
                        placeholder="Nhập tên giảng viên">
                </div>

                <div class="form-group">
                    <label for="note">Ghi chú</label>
                    <textarea
                        id="note"
                        name="note"
                        rows="4"
                        placeholder="Nhập ghi chú nếu có"></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="save-button">
                        Lưu lịch học
                    </button>

                    <button type="reset" class="reset-button">
                        Nhập lại
                    </button>
                </div>

            </form>
        </div>

        <div class="footer">
            My Timetable - Website quản lý thời khóa biểu
        </div>

    </div>

</body>
</html>
